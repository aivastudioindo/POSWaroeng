name: poswaroeng
description: "POSWaroeng - aplikasi kasir & manajemen toko untuk warung/UMKM Indonesia (offline)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.1
  flutter: 3.47.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (feature-first + testable tanpa emulator)
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^18.0.0

  # Database lokal (offline)
  sqflite: ^2.4.3
  path: ^1.9.1

  # Format uang & tanggal Indonesia
  intl: ^0.20.3

  # Tipografi Plus Jakarta Sans
  google_fonts: ^8.2.1

  # Printer thermal Bluetooth (ESC/POS)
  print_bluetooth_thermal: ^1.2.2
  esc_pos_utils_plus: ^2.0.4

  # Izin runtime Bluetooth (API 31+)
  permission_handler: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Uji DB/migrasi di runner Linux (tanpa Android)
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
